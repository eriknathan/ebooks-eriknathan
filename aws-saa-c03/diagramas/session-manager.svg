<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" font-family="IBM Plex Sans, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-head" d="M0 0 L10 5 L0 10 z" fill="#1b2d3b"/>
    </marker>
  </defs>

  <rect class="d-box" x="10" y="40" width="140" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="80" y="67" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Administrador</text>
  <text class="d-text" x="80" y="85" text-anchor="middle" font-size="11" fill="#52616d">identidade própria no IAM</text>

  <rect class="d-box-accent" x="200" y="40" width="170" height="60" rx="6" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-title" x="285" y="67" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Session Manager</text>
  <text class="d-text" x="285" y="85" text-anchor="middle" font-size="11" fill="#52616d">permissão por tag no IAM</text>

  <!-- VPC -->
  <rect class="d-zone" x="420" y="15" width="330" height="115" rx="6" fill="#f2f6f7" stroke="#cbd5db"/>
  <text class="d-label" x="434" y="33" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">VPC · subnet privada</text>
  <rect class="d-box" x="440" y="45" width="130" height="65" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="505" y="70" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2d3b">Endpoints</text>
  <text class="d-text" x="505" y="87" text-anchor="middle" font-size="10" fill="#52616d">ssm · ssmmessages</text>
  <text class="d-text" x="505" y="101" text-anchor="middle" font-size="10" fill="#52616d">ec2messages</text>
  <rect class="d-box" x="610" y="45" width="125" height="65" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="672" y="72" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">EC2</text>
  <text class="d-text" x="672" y="90" text-anchor="middle" font-size="11" fill="#52616d">SSM Agent</text>

  <rect class="d-zone" x="420" y="160" width="330" height="65" rx="6" fill="#f2f6f7" stroke="#cbd5db" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="d-title" x="585" y="186" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2d3b">Removidos</text>
  <text class="d-text" x="585" y="205" text-anchor="middle" font-size="11" fill="#52616d">chaves SSH, porta 22 aberta e bastion</text>

  <rect class="d-box" x="200" y="160" width="170" height="65" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="285" y="186" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2d3b">CloudWatch Logs / S3</text>
  <text class="d-text" x="285" y="205" text-anchor="middle" font-size="11" fill="#52616d">registro da sessão</text>

  <rect class="d-box" x="10" y="160" width="140" height="65" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="80" y="186" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">CloudTrail</text>
  <text class="d-text" x="80" y="205" text-anchor="middle" font-size="11" fill="#52616d">quem abriu e quando</text>

  <!-- 1: autoriza -->
  <line class="d-line" x1="150" y1="70" x2="198" y2="70" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="174" cy="53" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="174" y="57" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">1</text>

  <!-- 2 e 3: canal pela rede privada -->
  <line class="d-line" x1="438" y1="70" x2="372" y2="70" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="405" cy="53" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="405" y="57" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">3</text>
  <line class="d-line" x1="608" y1="77" x2="572" y2="77" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="590" cy="60" r="9" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="590" y="64" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">2</text>
  <text class="d-text" x="585" y="124" text-anchor="middle" font-size="11" fill="#52616d">o agente só abre conexões de saída</text>

  <!-- 4: logs -->
  <line class="d-line" x1="285" y1="100" x2="285" y2="158" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="267" cy="129" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="267" y="133" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">4</text>

  <!-- 5: CloudTrail -->
  <polyline class="d-line" points="200,90 175,90 175,192 152,192" fill="none" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="175" cy="140" r="9" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="175" y="144" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">5</text>
</svg>

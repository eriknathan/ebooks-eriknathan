<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 255" font-family="IBM Plex Sans, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-head" d="M0 0 L10 5 L0 10 z" fill="#1b2d3b"/>
    </marker>
  </defs>

  <!-- Região primária -->
  <rect class="d-zone" x="10" y="15" width="365" height="225" rx="6" fill="#f2f6f7" stroke="#cbd5db"/>
  <text class="d-label" x="24" y="33" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">Região primária</text>
  <rect class="d-box" x="30" y="50" width="120" height="70" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="90" y="76" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Rotação</text>
  <text class="d-text" x="90" y="94" text-anchor="middle" font-size="11" fill="#52616d">a cada 30 dias</text>
  <text class="d-text" x="90" y="109" text-anchor="middle" font-size="11" fill="#52616d">sem código próprio</text>
  <rect class="d-box-accent" x="190" y="50" width="170" height="70" rx="6" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-title" x="275" y="80" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Secrets Manager</text>
  <text class="d-text" x="275" y="99" text-anchor="middle" font-size="11" fill="#52616d">segredo primário</text>
  <rect class="d-box" x="190" y="160" width="170" height="65" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="275" y="188" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">RDS for MySQL</text>
  <text class="d-text" x="275" y="206" text-anchor="middle" font-size="11" fill="#52616d">banco de origem</text>

  <!-- Região secundária -->
  <rect class="d-zone" x="545" y="15" width="205" height="225" rx="6" fill="#f2f6f7" stroke="#cbd5db"/>
  <text class="d-label" x="559" y="33" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">Região secundária</text>
  <rect class="d-box" x="565" y="50" width="170" height="70" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="650" y="80" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Secrets Manager</text>
  <text class="d-text" x="650" y="99" text-anchor="middle" font-size="11" fill="#52616d">réplica, só leitura</text>
  <rect class="d-box" x="565" y="160" width="170" height="65" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="650" y="188" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">RDS for MySQL</text>
  <text class="d-text" x="650" y="206" text-anchor="middle" font-size="11" fill="#52616d">read replica cross-Region</text>
  <text class="d-text" x="650" y="143" text-anchor="middle" font-size="11" fill="#52616d">mesma senha nos dois</text>

  <!-- 1: rotação agendada -->
  <line class="d-line" x1="190" y1="85" x2="152" y2="85" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="171" cy="68" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="171" y="72" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">1</text>

  <!-- 2: troca a senha no banco -->
  <polyline class="d-line" points="90,120 90,192 188,192" fill="none" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="72" cy="156" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="72" y="160" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">2</text>

  <!-- 3: replicação do segredo -->
  <line class="d-line" x1="360" y1="85" x2="563" y2="85" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="460" cy="68" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="460" y="72" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">3</text>
  <text class="d-text" x="460" y="104" text-anchor="middle" font-size="11" fill="#52616d">réplica do segredo</text>

  <!-- 4: replicação do banco -->
  <line class="d-line" x1="360" y1="192" x2="563" y2="192" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="460" cy="175" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="460" y="179" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">4</text>
  <text class="d-text" x="460" y="211" text-anchor="middle" font-size="11" fill="#52616d">réplica do banco</text>
</svg>

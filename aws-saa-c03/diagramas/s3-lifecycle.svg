<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" font-family="IBM Plex Sans, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-head" d="M0 0 L10 5 L0 10 z" fill="#1b2d3b"/>
    </marker>
  </defs>

  <rect class="d-box" x="10" y="40" width="155" height="70" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="87" y="71" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Aplicação</text>
  <text class="d-text" x="87" y="90" text-anchor="middle" font-size="12" fill="#52616d">gera os arquivos</text>

  <rect class="d-box" x="205" y="40" width="155" height="70" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="282" y="71" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">S3 Standard</text>
  <text class="d-text" x="282" y="90" text-anchor="middle" font-size="12" fill="#52616d">dias 0 a 30</text>

  <rect class="d-box-accent" x="400" y="40" width="155" height="70" rx="6" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-title" x="477" y="71" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">S3 Standard-IA</text>
  <text class="d-text" x="477" y="90" text-anchor="middle" font-size="12" fill="#52616d">30 dias a 4 anos</text>

  <rect class="d-zone" x="595" y="40" width="155" height="70" rx="6" fill="#f2f6f7" stroke="#cbd5db" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="d-title" x="672" y="71" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Expiração</text>
  <text class="d-text" x="672" y="90" text-anchor="middle" font-size="12" fill="#52616d">objeto excluído</text>

  <line class="d-line" x1="165" y1="75" x2="203" y2="75" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <line class="d-line" x1="360" y1="75" x2="398" y2="75" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <line class="d-line-muted" x1="555" y1="75" x2="593" y2="75" stroke="#52616d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#seta)"/>

  <circle class="d-step" cx="185" cy="24" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="185" y="28" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">1</text>
  <circle class="d-step" cx="380" cy="24" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="380" y="28" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">2</text>
  <circle class="d-step" cx="575" cy="24" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="575" y="28" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">3</text>

  <text class="d-text" x="185" y="136" text-anchor="middle" font-size="11" fill="#52616d">Upload</text>
  <text class="d-text" x="380" y="136" text-anchor="middle" font-size="11" fill="#52616d">Transição aos 30 dias</text>
  <text class="d-text" x="575" y="136" text-anchor="middle" font-size="11" fill="#52616d">Expiração aos 1.460 dias</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 245" font-family="IBM Plex Sans, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-head" d="M0 0 L10 5 L0 10 z" fill="#1b2d3b"/>
    </marker>
  </defs>

  <rect class="d-box" x="10" y="95" width="120" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="70" y="122" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Amazon RDS</text>
  <text class="d-text" x="70" y="140" text-anchor="middle" font-size="11" fill="#52616d">venda concluída</text>

  <!-- Opção A: outbox -->
  <rect class="d-box" x="180" y="20" width="150" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="255" y="45" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2d3b">Trigger + tabela</text>
  <text class="d-text" x="255" y="63" text-anchor="middle" font-size="11" fill="#52616d">de eventos (outbox)</text>
  <rect class="d-box" x="370" y="20" width="130" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="435" y="45" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2d3b">Lambda</text>
  <text class="d-text" x="435" y="63" text-anchor="middle" font-size="11" fill="#52616d">lê o que é novo</text>

  <!-- Opção B: DMS -->
  <rect class="d-box" x="180" y="170" width="150" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="255" y="195" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2d3b">AWS DMS</text>
  <text class="d-text" x="255" y="213" text-anchor="middle" font-size="11" fill="#52616d">CDC pelo binlog</text>
  <rect class="d-box" x="370" y="170" width="130" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="435" y="195" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2d3b">Kinesis</text>
  <text class="d-text" x="435" y="213" text-anchor="middle" font-size="11" fill="#52616d">Data Streams</text>

  <!-- Fan-out -->
  <rect class="d-box-accent" x="540" y="95" width="85" height="60" rx="6" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-title" x="582" y="122" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">SNS</text>
  <text class="d-text" x="582" y="140" text-anchor="middle" font-size="11" fill="#52616d">fan-out</text>

  <rect class="d-box" x="655" y="20" width="95" height="50" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="702" y="41" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2d3b">Fila SQS</text>
  <text class="d-text" x="702" y="58" text-anchor="middle" font-size="11" fill="#52616d">busca</text>
  <rect class="d-box" x="655" y="100" width="95" height="50" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="702" y="121" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2d3b">Fila SQS</text>
  <text class="d-text" x="702" y="138" text-anchor="middle" font-size="11" fill="#52616d">fraude</text>
  <rect class="d-box" x="655" y="180" width="95" height="50" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="702" y="201" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2d3b">Fila SQS</text>
  <text class="d-text" x="702" y="218" text-anchor="middle" font-size="11" fill="#52616d">relatórios</text>

  <!-- RDS para as duas opções -->
  <polyline class="d-line" points="130,110 155,110 155,50 178,50" fill="none" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <polyline class="d-line" points="130,140 155,140 155,200 178,200" fill="none" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="155" cy="125" r="9" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="155" y="129" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">1</text>

  <line class="d-line" x1="330" y1="50" x2="368" y2="50" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="349" cy="34" r="9" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="349" y="38" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">2</text>
  <line class="d-line" x1="330" y1="200" x2="368" y2="200" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="349" cy="184" r="9" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="349" y="188" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">3</text>

  <!-- Para o SNS -->
  <polyline class="d-line" points="500,50 520,50 520,113 538,113" fill="none" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <polyline class="d-line" points="500,200 520,200 520,137 538,137" fill="none" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <text class="d-text" x="510" y="160" text-anchor="end" font-size="10" fill="#52616d">consumidor</text>

  <!-- Fan-out para as filas -->
  <polyline class="d-line" points="625,115 640,115 640,45 653,45" fill="none" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <line class="d-line" x1="625" y1="125" x2="653" y2="125" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <polyline class="d-line" points="625,135 640,135 640,205 653,205" fill="none" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="582" cy="170" r="9" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="582" y="174" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">4</text>
</svg>

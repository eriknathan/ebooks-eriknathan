<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="IBM Plex Sans, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-head" d="M0 0 L10 5 L0 10 z" fill="#1b2d3b"/>
    </marker>
  </defs>

  <!-- Caminho novo -->
  <rect class="d-box" x="10" y="40" width="116" height="70" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="68" y="71" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2d3b">Amazon S3</text>
  <text class="d-text" x="68" y="90" text-anchor="middle" font-size="11" fill="#52616d">upload da imagem</text>

  <rect class="d-box" x="166" y="40" width="116" height="70" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="224" y="71" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2d3b">EventBridge</text>
  <text class="d-text" x="224" y="90" text-anchor="middle" font-size="11" fill="#52616d">regra do bucket</text>

  <rect class="d-box-accent" x="322" y="40" width="116" height="70" rx="6" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-title" x="380" y="71" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2d3b">SQS FIFO</text>
  <text class="d-text" x="380" y="90" text-anchor="middle" font-size="11" fill="#52616d">deduplicação</text>

  <rect class="d-box" x="478" y="40" width="116" height="70" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="536" y="71" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2d3b">Lambda</text>
  <text class="d-text" x="536" y="90" text-anchor="middle" font-size="11" fill="#52616d">processa a imagem</text>

  <rect class="d-box" x="634" y="40" width="116" height="70" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="692" y="71" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2d3b">Amazon SES</text>
  <text class="d-text" x="692" y="90" text-anchor="middle" font-size="11" fill="#52616d">e-mail ao usuário</text>

  <line class="d-line" x1="126" y1="75" x2="164" y2="75" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <line class="d-line" x1="282" y1="75" x2="320" y2="75" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <line class="d-line" x1="438" y1="75" x2="476" y2="75" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <line class="d-line" x1="594" y1="75" x2="632" y2="75" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>

  <circle class="d-step" cx="145" cy="24" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="145" y="28" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">1</text>
  <circle class="d-step" cx="301" cy="24" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="301" y="28" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">2</text>
  <circle class="d-step" cx="457" cy="24" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="457" y="28" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">3</text>
  <circle class="d-step" cx="613" cy="24" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="613" y="28" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">4</text>

  <!-- Caminho antigo -->
  <line class="d-line-muted" x1="68" y1="110" x2="68" y2="166" stroke="#52616d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#seta)"/>
  <rect class="d-zone" x="10" y="168" width="116" height="70" rx="6" fill="#f2f6f7" stroke="#cbd5db" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="d-title" x="68" y="199" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2d3b">SQS Standard</text>
  <text class="d-text" x="68" y="218" text-anchor="middle" font-size="11" fill="#52616d">fila antiga</text>
  <text class="d-label" x="146" y="186" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">antes</text>
  <text class="d-text" x="146" y="205" font-size="12" fill="#52616d">Notificação direta do S3 e fila Standard: as duas entregam at-least-once,</text>
  <text class="d-text" x="146" y="223" font-size="12" fill="#52616d">então a Lambda pode receber o mesmo evento duas vezes e mandar dois e-mails.</text>
</svg>

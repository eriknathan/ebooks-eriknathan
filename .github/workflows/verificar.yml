name: Verificar e-books

# Falha se algum ebook.html estiver fora de sincronia com o material.md, o ebook.toml ou o
# template (alguém editou a fonte e não regenerou o HTML), ou se um README tiver link quebrado.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 é a versão mínima documentada no README; 3.x é a mais recente.
        python: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Regenerar os HTML a partir do Markdown
        run: python ferramentas/gerar_ebook.py

      - name: Conferir se os HTML commitados estão em sincronia
        run: |
          if ! git diff --quiet -- '*/ebook.html'; then
            git diff --stat -- '*/ebook.html'
            echo "::error::Algum ebook.html está desatualizado. Rode 'python3 ferramentas/gerar_ebook.py' e commite o resultado."
            exit 1
          fi

      - name: Conferir links relativos dos READMEs
        run: python ferramentas/verificar_links.py

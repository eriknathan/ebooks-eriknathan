<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="IBM Plex Sans, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-head" d="M0 0 L10 5 L0 10 z" fill="#1b2d3b"/>
    </marker>
  </defs>

  <!-- Aplicação -->
  <rect class="d-box" x="10" y="80" width="180" height="90" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="100" y="113" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Amazon EC2</text>
  <text class="d-text" x="100" y="132" text-anchor="middle" font-size="12" fill="#52616d">aplicação em contêiner</text>
  <text class="d-label" x="100" y="152" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">role do IAM</text>
  <circle class="d-step" cx="30" cy="80" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="30" y="84" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">1</text>

  <!-- KMS -->
  <rect class="d-box-accent" x="300" y="20" width="180" height="70" rx="6" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-title" x="390" y="50" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">AWS KMS</text>
  <text class="d-text" x="390" y="69" text-anchor="middle" font-size="12" fill="#52616d">chave gerenciada pelo cliente</text>

  <!-- S3 -->
  <rect class="d-box" x="300" y="160" width="180" height="70" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="390" y="190" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Amazon S3</text>
  <text class="d-text" x="390" y="209" text-anchor="middle" font-size="12" fill="#52616d">certificados criptografados</text>

  <!-- 2: Encrypt/Decrypt -->
  <polyline class="d-line" points="190,105 245,105 245,55 298,55" fill="none" stroke="#1b2d3b" stroke-width="1.5" marker-start="url(#seta)" marker-end="url(#seta)"/>
  <circle class="d-step" cx="220" cy="89" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="220" y="93" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">2</text>
  <text class="d-text" x="254" y="43" font-size="11" fill="#52616d">Encrypt</text>
  <text class="d-text" x="254" y="80" font-size="11" fill="#52616d">Decrypt</text>

  <!-- 3: Put/Get -->
  <polyline class="d-line" points="190,145 245,145 245,195 298,195" fill="none" stroke="#1b2d3b" stroke-width="1.5" marker-start="url(#seta)" marker-end="url(#seta)"/>
  <circle class="d-step" cx="220" cy="161" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="220" y="165" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">3</text>
  <text class="d-text" x="254" y="183" font-size="11" fill="#52616d">Put</text>
  <text class="d-text" x="254" y="220" font-size="11" fill="#52616d">Get</text>

  <!-- Alternativa descartada -->
  <line class="d-line-muted" x1="480" y1="195" x2="568" y2="195" stroke="#52616d" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect class="d-zone" x="570" y="160" width="180" height="70" rx="6" fill="#f2f6f7" stroke="#cbd5db" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="d-title" x="660" y="190" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Amazon EBS</text>
  <text class="d-text" x="660" y="209" text-anchor="middle" font-size="12" fill="#52616d">descartado: preso a uma AZ</text>
  <text class="d-label" x="524" y="185" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">em vez de</text>
</svg>

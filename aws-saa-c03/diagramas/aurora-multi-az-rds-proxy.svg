<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 265" font-family="IBM Plex Sans, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-head" d="M0 0 L10 5 L0 10 z" fill="#1b2d3b"/>
    </marker>
  </defs>

  <rect class="d-box" x="10" y="110" width="90" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="55" y="137" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2d3b">Usuários</text>
  <text class="d-text" x="55" y="155" text-anchor="middle" font-size="11" fill="#52616d">checkout</text>

  <rect class="d-box" x="128" y="95" width="100" height="90" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="178" y="136" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">ALB</text>
  <text class="d-text" x="178" y="154" text-anchor="middle" font-size="11" fill="#52616d">várias AZs</text>

  <!-- AZs -->
  <rect class="d-zone" x="260" y="15" width="490" height="110" rx="6" fill="#f2f6f7" stroke="#cbd5db"/>
  <text class="d-label" x="274" y="33" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">AZ a</text>
  <rect class="d-zone" x="260" y="145" width="490" height="110" rx="6" fill="#f2f6f7" stroke="#cbd5db"/>
  <text class="d-label" x="274" y="163" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">AZ b</text>

  <rect class="d-box" x="280" y="45" width="140" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="350" y="72" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">EC2</text>
  <text class="d-text" x="350" y="90" text-anchor="middle" font-size="11" fill="#52616d">Auto Scaling group</text>
  <rect class="d-box" x="280" y="175" width="140" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="350" y="202" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">EC2</text>
  <text class="d-text" x="350" y="220" text-anchor="middle" font-size="11" fill="#52616d">Auto Scaling group</text>

  <rect class="d-box-accent" x="455" y="55" width="120" height="170" rx="6" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-title" x="515" y="132" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">RDS Proxy</text>
  <text class="d-text" x="515" y="150" text-anchor="middle" font-size="11" fill="#52616d">pool de conexões</text>

  <rect class="d-box" x="610" y="45" width="130" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="675" y="72" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Aurora writer</text>
  <text class="d-text" x="675" y="90" text-anchor="middle" font-size="11" fill="#52616d">leitura e escrita</text>
  <rect class="d-box" x="610" y="175" width="130" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="675" y="202" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Aurora Replica</text>
  <text class="d-text" x="675" y="220" text-anchor="middle" font-size="11" fill="#52616d">alvo de failover</text>
  <text class="d-text" x="675" y="139" text-anchor="middle" font-size="11" fill="#52616d">volume compartilhado em 3 AZs</text>

  <!-- 1 -->
  <line class="d-line" x1="100" y1="140" x2="126" y2="140" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="113" cy="98" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="113" y="102" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">1</text>

  <!-- 2: ALB para as duas AZs -->
  <polyline class="d-line" points="228,120 252,120 252,75 278,75" fill="none" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <polyline class="d-line" points="228,160 252,160 252,205 278,205" fill="none" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="241" cy="140" r="9" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="241" y="144" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">2</text>

  <!-- 3: aplicação para o proxy -->
  <line class="d-line" x1="420" y1="75" x2="453" y2="75" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <line class="d-line" x1="420" y1="205" x2="453" y2="205" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="437" cy="140" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="437" y="144" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">3</text>

  <!-- 4: proxy para o writer -->
  <line class="d-line" x1="575" y1="75" x2="608" y2="75" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="592" cy="58" r="9" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="592" y="62" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">4</text>

  <!-- 5: failover -->
  <line class="d-line-muted" x1="575" y1="205" x2="608" y2="205" stroke="#52616d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#seta)"/>
  <circle class="d-step" cx="592" cy="188" r="9" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="592" y="192" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">5</text>
</svg>

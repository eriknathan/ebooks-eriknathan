<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" font-family="IBM Plex Sans, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-head" d="M0 0 L10 5 L0 10 z" fill="#1b2d3b"/>
    </marker>
  </defs>

  <!-- VPC A -->
  <rect class="d-zone" x="10" y="15" width="220" height="115" rx="6" fill="#f2f6f7" stroke="#cbd5db"/>
  <text class="d-label" x="24" y="33" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">VPC A · 10.0.0.0/16</text>
  <rect class="d-box" x="30" y="45" width="180" height="70" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="120" y="72" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Aplicação</text>
  <text class="d-text" x="120" y="90" text-anchor="middle" font-size="11" fill="#52616d">conta de produção</text>
  <text class="d-text" x="120" y="105" text-anchor="middle" font-size="10" fill="#52616d">10.1.0.0/16 → pcx-ab</text>

  <!-- VPC B -->
  <rect class="d-zone" x="270" y="15" width="220" height="115" rx="6" fill="#f2f6f7" stroke="#cbd5db"/>
  <text class="d-label" x="284" y="33" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">VPC B · 10.1.0.0/16</text>
  <rect class="d-box-accent" x="290" y="45" width="180" height="70" rx="6" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-title" x="380" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2d3b">Serviços compartilhados</text>
  <text class="d-text" x="380" y="90" text-anchor="middle" font-size="11" fill="#52616d">AD e monitoramento</text>
  <text class="d-text" x="380" y="105" text-anchor="middle" font-size="10" fill="#52616d">rotas para A e para C</text>

  <!-- VPC C -->
  <rect class="d-zone" x="530" y="15" width="220" height="115" rx="6" fill="#f2f6f7" stroke="#cbd5db"/>
  <text class="d-label" x="544" y="33" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">VPC C · 10.2.0.0/16</text>
  <rect class="d-box" x="550" y="45" width="180" height="70" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="640" y="72" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Analytics</text>
  <text class="d-text" x="640" y="90" text-anchor="middle" font-size="11" fill="#52616d">outra Região</text>
  <text class="d-text" x="640" y="105" text-anchor="middle" font-size="10" fill="#52616d">10.1.0.0/16 → pcx-bc</text>

  <!-- 1: peering A-B -->
  <line class="d-line" x1="210" y1="70" x2="288" y2="70" stroke="#1b2d3b" stroke-width="1.5" marker-start="url(#seta)" marker-end="url(#seta)"/>
  <circle class="d-step" cx="250" cy="53" r="9" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="250" y="57" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">1</text>
  <text class="d-label" x="250" y="92" text-anchor="middle" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">pcx-ab</text>

  <!-- 2: peering B-C -->
  <line class="d-line" x1="470" y1="70" x2="548" y2="70" stroke="#1b2d3b" stroke-width="1.5" marker-start="url(#seta)" marker-end="url(#seta)"/>
  <circle class="d-step" cx="510" cy="53" r="9" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="510" y="57" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">2</text>
  <text class="d-label" x="510" y="92" text-anchor="middle" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">pcx-bc</text>

  <!-- 3: A para C não passa por B -->
  <polyline class="d-line-muted" points="120,130 120,170 640,170 640,132" fill="none" stroke="#52616d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#seta)"/>
  <circle class="d-step" cx="380" cy="170" r="9" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="380" y="174" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">3</text>
  <text class="d-text" x="380" y="192" text-anchor="middle" font-size="11" fill="#52616d">A não alcança C passando por B: o peering não é transitivo</text>
  <text class="d-text" x="380" y="207" text-anchor="middle" font-size="11" fill="#52616d">para A falar com C, crie pcx-ac com rotas nos dois lados</text>

  <!-- 4: sem edge-to-edge -->
  <rect class="d-zone" x="270" y="225" width="220" height="55" rx="6" fill="#f2f6f7" stroke="#cbd5db" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="d-title" x="380" y="248" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2d3b">NAT e IGW da VPC B</text>
  <text class="d-text" x="380" y="266" text-anchor="middle" font-size="11" fill="#52616d">não servem para a VPC A</text>
  <polyline class="d-line-muted" points="60,130 60,252 268,252" fill="none" stroke="#52616d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#seta)"/>
  <circle class="d-step" cx="60" cy="215" r="9" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="60" y="219" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">4</text>
</svg>

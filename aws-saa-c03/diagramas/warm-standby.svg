<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="IBM Plex Sans, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-head" d="M0 0 L10 5 L0 10 z" fill="#1b2d3b"/>
    </marker>
  </defs>

  <!-- Usuários e Route 53 -->
  <rect class="d-box" x="10" y="115" width="100" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="60" y="142" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Usuários</text>
  <text class="d-text" x="60" y="160" text-anchor="middle" font-size="12" fill="#52616d">streaming</text>

  <rect class="d-box" x="140" y="105" width="120" height="80" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="200" y="135" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Route 53</text>
  <text class="d-text" x="200" y="154" text-anchor="middle" font-size="11" fill="#52616d">failover</text>
  <text class="d-text" x="200" y="170" text-anchor="middle" font-size="11" fill="#52616d">+ health check</text>

  <line class="d-line" x1="110" y1="145" x2="138" y2="145" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="124" cy="127" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="124" y="131" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">1</text>

  <!-- Região primária -->
  <rect class="d-zone" x="300" y="15" width="450" height="120" rx="6" fill="#f2f6f7" stroke="#cbd5db"/>
  <text class="d-label" x="314" y="33" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">Região primária · com tráfego</text>
  <rect class="d-box" x="320" y="45" width="90" height="70" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="365" y="84" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">ALB</text>
  <rect class="d-box" x="450" y="45" width="130" height="70" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="515" y="75" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2d3b">EC2 Auto Scaling</text>
  <text class="d-text" x="515" y="94" text-anchor="middle" font-size="11" fill="#52616d">capacidade total</text>
  <rect class="d-box" x="615" y="45" width="120" height="70" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="675" y="75" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2d3b">Aurora</text>
  <text class="d-text" x="675" y="94" text-anchor="middle" font-size="11" fill="#52616d">primário</text>
  <line class="d-line" x1="410" y1="80" x2="448" y2="80" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <line class="d-line" x1="580" y1="80" x2="613" y2="80" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>

  <!-- Região de DR -->
  <rect class="d-zone" x="300" y="165" width="450" height="120" rx="6" fill="#f2f6f7" stroke="#cbd5db"/>
  <text class="d-label" x="314" y="183" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">Região de DR · ligada, sem tráfego</text>
  <rect class="d-box" x="320" y="195" width="90" height="70" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="365" y="234" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">ALB</text>
  <rect class="d-box-accent" x="450" y="195" width="130" height="70" rx="6" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-title" x="515" y="225" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2d3b">EC2 Auto Scaling</text>
  <text class="d-text" x="515" y="244" text-anchor="middle" font-size="11" fill="#52616d">capacidade mínima</text>
  <rect class="d-box" x="615" y="195" width="120" height="70" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="675" y="225" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2d3b">Aurora</text>
  <text class="d-text" x="675" y="244" text-anchor="middle" font-size="11" fill="#52616d">secundário</text>
  <line class="d-line-muted" x1="410" y1="230" x2="448" y2="230" stroke="#52616d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#seta)"/>
  <line class="d-line-muted" x1="580" y1="230" x2="613" y2="230" stroke="#52616d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#seta)"/>

  <!-- 2: caminho normal -->
  <polyline class="d-line" points="260,125 285,125 285,80 318,80" fill="none" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="272" cy="96" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="272" y="100" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">2</text>

  <!-- 3: replicação -->
  <line class="d-line" x1="675" y1="115" x2="675" y2="193" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="655" cy="150" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="655" y="154" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">3</text>
  <text class="d-text" x="686" y="154" font-size="11" fill="#52616d">réplica</text>

  <!-- 4: failover -->
  <polyline class="d-line-muted" points="260,165 285,165 285,230 318,230" fill="none" stroke="#52616d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#seta)"/>
  <circle class="d-step" cx="272" cy="200" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="272" y="204" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">4</text>
</svg>

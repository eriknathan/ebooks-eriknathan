<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" font-family="IBM Plex Sans, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-head" d="M0 0 L10 5 L0 10 z" fill="#1b2d3b"/>
    </marker>
  </defs>

  <!-- On-premises -->
  <rect class="d-zone" x="10" y="20" width="180" height="250" rx="6" fill="#f2f6f7" stroke="#cbd5db"/>
  <text class="d-label" x="24" y="40" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">on-premises</text>
  <rect class="d-box" x="25" y="55" width="150" height="70" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="100" y="86" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Kubernetes</text>
  <text class="d-text" x="100" y="106" text-anchor="middle" font-size="12" fill="#52616d">manifests YAML</text>
  <rect class="d-box" x="25" y="175" width="150" height="70" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="100" y="206" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">MongoDB</text>
  <text class="d-text" x="100" y="226" text-anchor="middle" font-size="12" fill="#52616d">dados da aplicação</text>

  <!-- AWS -->
  <rect class="d-zone" x="260" y="20" width="490" height="250" rx="6" fill="#f2f6f7" stroke="#cbd5db"/>
  <text class="d-label" x="274" y="40" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">AWS</text>
  <rect class="d-box" x="290" y="55" width="170" height="70" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="375" y="86" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Amazon EKS</text>
  <text class="d-text" x="375" y="106" text-anchor="middle" font-size="12" fill="#52616d">control plane gerenciado</text>
  <rect class="d-box-accent" x="560" y="55" width="170" height="70" rx="6" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-title" x="645" y="86" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">AWS Fargate</text>
  <text class="d-text" x="645" y="106" text-anchor="middle" font-size="12" fill="#52616d">pods sem nós EC2</text>
  <rect class="d-box" x="560" y="175" width="170" height="70" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="645" y="206" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Amazon DocumentDB</text>
  <text class="d-text" x="645" y="226" text-anchor="middle" font-size="12" fill="#52616d">compatível com MongoDB</text>

  <!-- 1: manifests → EKS -->
  <line class="d-line" x1="175" y1="90" x2="288" y2="90" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="225" cy="71" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="225" y="75" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">1</text>
  <text class="d-text" x="225" y="108" text-anchor="middle" font-size="11" fill="#52616d">Mesmos</text>
  <text class="d-text" x="225" y="121" text-anchor="middle" font-size="11" fill="#52616d">manifests</text>

  <!-- 2: EKS → Fargate -->
  <line class="d-line" x1="460" y1="90" x2="558" y2="90" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="510" cy="71" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="510" y="75" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">2</text>
  <text class="d-text" x="510" y="110" text-anchor="middle" font-size="11" fill="#52616d">Fargate profile</text>

  <!-- 3: MongoDB → DocumentDB -->
  <line class="d-line" x1="175" y1="210" x2="558" y2="210" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="375" cy="191" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="375" y="195" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">3</text>
  <text class="d-text" x="375" y="230" text-anchor="middle" font-size="11" fill="#52616d">Migração com AWS DMS</text>

  <!-- 4: pods → DocumentDB -->
  <line class="d-line" x1="645" y1="125" x2="645" y2="173" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="625" cy="149" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="625" y="153" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">4</text>
  <text class="d-text" x="657" y="153" font-size="11" fill="#52616d">Driver MongoDB</text>
</svg>

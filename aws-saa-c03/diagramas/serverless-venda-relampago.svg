<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" font-family="IBM Plex Sans, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-head" d="M0 0 L10 5 L0 10 z" fill="#1b2d3b"/>
    </marker>
  </defs>

  <rect class="d-box" x="10" y="95" width="100" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="60" y="122" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Usuários</text>
  <text class="d-text" x="60" y="140" text-anchor="middle" font-size="11" fill="#52616d">pico imprevisível</text>

  <rect class="d-box" x="150" y="95" width="140" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="220" y="122" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">CloudFront</text>
  <text class="d-text" x="220" y="140" text-anchor="middle" font-size="11" fill="#52616d">cache na borda + WAF</text>

  <rect class="d-box" x="360" y="20" width="140" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="430" y="47" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Amazon S3</text>
  <text class="d-text" x="430" y="65" text-anchor="middle" font-size="11" fill="#52616d">site estático</text>

  <rect class="d-box" x="360" y="165" width="140" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="430" y="192" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">API Gateway</text>
  <text class="d-text" x="430" y="210" text-anchor="middle" font-size="11" fill="#52616d">throttling</text>

  <rect class="d-box-accent" x="535" y="165" width="105" height="60" rx="6" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-title" x="587" y="192" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Lambda</text>
  <text class="d-text" x="587" y="210" text-anchor="middle" font-size="11" fill="#52616d">pedidos</text>

  <rect class="d-box" x="665" y="165" width="85" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="707" y="192" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2d3b">DynamoDB</text>
  <text class="d-text" x="707" y="210" text-anchor="middle" font-size="11" fill="#52616d">on-demand</text>

  <!-- 1 -->
  <line class="d-line" x1="110" y1="125" x2="148" y2="125" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="129" cy="107" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="129" y="111" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">1</text>

  <!-- 2 e 3: estático e API -->
  <line class="d-line" x1="290" y1="125" x2="325" y2="125" stroke="#1b2d3b" stroke-width="1.5"/>
  <polyline class="d-line" points="325,125 325,50 358,50" fill="none" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <polyline class="d-line" points="325,125 325,195 358,195" fill="none" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="342" cy="34" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="342" y="38" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">2</text>
  <circle class="d-step" cx="342" cy="179" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="342" y="183" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">3</text>

  <!-- 4 e 5 -->
  <line class="d-line" x1="500" y1="195" x2="533" y2="195" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="517" cy="152" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="517" y="156" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">4</text>
  <line class="d-line" x1="640" y1="195" x2="663" y2="195" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="652" cy="152" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="652" y="156" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">5</text>

  <!-- Nota -->
  <rect class="d-zone" x="535" y="20" width="215" height="110" rx="6" fill="#f2f6f7" stroke="#cbd5db"/>
  <text class="d-label" x="549" y="40" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">antes do evento</text>
  <text class="d-text" x="549" y="62" font-size="11" fill="#52616d">pedir aumento das cotas</text>
  <text class="d-text" x="549" y="80" font-size="11" fill="#52616d">da Lambda e do API Gateway</text>
  <text class="d-text" x="549" y="98" font-size="11" fill="#52616d">pre-warm do DynamoDB</text>
  <text class="d-text" x="549" y="116" font-size="11" fill="#52616d">chave sem hot partition</text>
</svg>

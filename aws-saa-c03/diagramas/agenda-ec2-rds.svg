<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" font-family="IBM Plex Sans, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-head" d="M0 0 L10 5 L0 10 z" fill="#1b2d3b"/>
    </marker>
  </defs>

  <rect class="d-box" x="10" y="55" width="170" height="80" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="95" y="85" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">EventBridge</text>
  <text class="d-text" x="95" y="104" text-anchor="middle" font-size="11" fill="#52616d">agenda: 8h liga, 19h desliga</text>
  <text class="d-text" x="95" y="120" text-anchor="middle" font-size="11" fill="#52616d">cron com fuso horário</text>

  <rect class="d-box-accent" x="260" y="55" width="170" height="80" rx="6" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-title" x="345" y="85" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">AWS Lambda</text>
  <text class="d-text" x="345" y="104" text-anchor="middle" font-size="11" fill="#52616d">seleciona por tag</text>
  <text class="d-label" x="345" y="121" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">tag Schedule=dev</text>

  <rect class="d-box" x="560" y="20" width="190" height="65" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="655" y="44" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Amazon EC2</text>
  <text class="d-text" x="655" y="62" text-anchor="middle" font-size="11" fill="#52616d">Start/StopInstances</text>
  <text class="d-text" x="655" y="77" text-anchor="middle" font-size="11" fill="#52616d">EBS e IPv4 seguem cobrados</text>

  <rect class="d-box" x="560" y="115" width="190" height="65" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="655" y="139" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Amazon RDS</text>
  <text class="d-text" x="655" y="157" text-anchor="middle" font-size="11" fill="#52616d">Start/StopDBInstance</text>
  <text class="d-text" x="655" y="172" text-anchor="middle" font-size="11" fill="#52616d">religa após 7 dias parado</text>

  <line class="d-line" x1="180" y1="95" x2="258" y2="95" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="219" cy="77" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="219" y="81" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">1</text>

  <line class="d-line" x1="430" y1="95" x2="495" y2="95" stroke="#1b2d3b" stroke-width="1.5"/>
  <polyline class="d-line" points="495,95 495,52 558,52" fill="none" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <polyline class="d-line" points="495,95 495,147 558,147" fill="none" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="527" cy="36" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="527" y="40" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">2</text>
  <circle class="d-step" cx="527" cy="131" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="527" y="135" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">3</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 275" font-family="IBM Plex Sans, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-head" d="M0 0 L10 5 L0 10 z" fill="#1b2d3b"/>
    </marker>
  </defs>

  <rect class="d-box" x="10" y="30" width="140" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="80" y="56" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2d3b">Transportadora A</text>
  <text class="d-text" x="80" y="74" text-anchor="middle" font-size="11" fill="#52616d">chave SSH própria</text>

  <rect class="d-box" x="10" y="130" width="140" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="80" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2d3b">Transportadora B</text>
  <text class="d-text" x="80" y="174" text-anchor="middle" font-size="11" fill="#52616d">chave SSH própria</text>

  <rect class="d-box-accent" x="200" y="60" width="160" height="90" rx="6" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-title" x="280" y="88" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Transfer Family</text>
  <text class="d-text" x="280" y="106" text-anchor="middle" font-size="11" fill="#52616d">servidor SFTP</text>
  <text class="d-text" x="280" y="121" text-anchor="middle" font-size="11" fill="#52616d">um usuário por parceiro</text>
  <text class="d-text" x="280" y="136" text-anchor="middle" font-size="11" fill="#52616d">home lógico (chroot)</text>

  <rect class="d-box" x="410" y="60" width="160" height="90" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="490" y="88" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2d3b">Role do IAM</text>
  <text class="d-text" x="490" y="106" text-anchor="middle" font-size="11" fill="#52616d">+ session policy</text>
  <text class="d-label" x="490" y="128" text-anchor="middle" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">${transfer:UserName}/*</text>

  <rect class="d-box" x="200" y="200" width="160" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="280" y="226" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2d3b">CloudWatch Logs</text>
  <text class="d-text" x="280" y="244" text-anchor="middle" font-size="11" fill="#52616d">usuário, arquivo e hora</text>

  <!-- Bucket -->
  <rect class="d-zone" x="610" y="15" width="140" height="205" rx="6" fill="#f2f6f7" stroke="#cbd5db"/>
  <text class="d-label" x="622" y="33" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">S3 · manifestos</text>
  <rect class="d-box" x="625" y="45" width="110" height="55" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="680" y="68" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2d3b">Prefixo A</text>
  <text class="d-text" x="680" y="86" text-anchor="middle" font-size="10" fill="#52616d">transportadora-a/</text>
  <rect class="d-box" x="625" y="130" width="110" height="55" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="680" y="153" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2d3b">Prefixo B</text>
  <text class="d-text" x="680" y="171" text-anchor="middle" font-size="10" fill="#52616d">transportadora-b/</text>
  <text class="d-label" x="680" y="208" text-anchor="middle" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">A em B: negado</text>

  <!-- 1: conexão SFTP -->
  <polyline class="d-line" points="150,60 175,60 175,95 198,95" fill="none" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <polyline class="d-line" points="150,160 175,160 175,125 198,125" fill="none" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="175" cy="110" r="9" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="175" y="114" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">1</text>

  <!-- 2: assume a role com a session policy -->
  <line class="d-line" x1="360" y1="105" x2="408" y2="105" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="384" cy="88" r="9" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="384" y="92" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">2</text>

  <!-- 3: só o próprio prefixo -->
  <polyline class="d-line" points="570,85 595,85 595,72 623,72" fill="none" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <polyline class="d-line-muted" points="570,125 595,125 595,157 623,157" fill="none" stroke="#52616d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#seta)"/>
  <circle class="d-step" cx="583" cy="105" r="9" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="583" y="109" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">3</text>

  <!-- 4: auditoria -->
  <line class="d-line" x1="280" y1="150" x2="280" y2="198" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="262" cy="175" r="9" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="262" y="179" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">4</text>
</svg>

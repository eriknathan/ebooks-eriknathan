<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 215" font-family="IBM Plex Sans, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-head" d="M0 0 L10 5 L0 10 z" fill="#1b2d3b"/>
    </marker>
  </defs>

  <rect class="d-box" x="10" y="40" width="140" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="80" y="67" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">CA externa</text>
  <text class="d-text" x="80" y="85" text-anchor="middle" font-size="11" fill="#52616d">certificado wildcard</text>

  <rect class="d-box-accent" x="210" y="40" width="160" height="60" rx="6" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-title" x="290" y="67" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">ACM</text>
  <text class="d-text" x="290" y="85" text-anchor="middle" font-size="11" fill="#52616d">certificado importado</text>

  <rect class="d-box" x="430" y="40" width="140" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="500" y="67" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">ALB</text>
  <text class="d-text" x="500" y="85" text-anchor="middle" font-size="11" fill="#52616d">listener HTTPS</text>

  <rect class="d-box" x="210" y="140" width="160" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="290" y="165" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2d3b">EventBridge</text>
  <text class="d-text" x="290" y="183" text-anchor="middle" font-size="11" fill="#52616d">evento de expiração</text>

  <rect class="d-box" x="430" y="140" width="140" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="500" y="167" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">SNS</text>
  <text class="d-text" x="500" y="185" text-anchor="middle" font-size="11" fill="#52616d">alerta à equipe</text>

  <rect class="d-box" x="620" y="140" width="130" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="685" y="167" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Equipe</text>
  <text class="d-text" x="685" y="185" text-anchor="middle" font-size="11" fill="#52616d">renova na CA</text>

  <!-- 1: importa -->
  <line class="d-line" x1="150" y1="70" x2="208" y2="70" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="179" cy="53" r="9" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="179" y="57" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">1</text>

  <!-- 2: ALB usa -->
  <line class="d-line" x1="370" y1="70" x2="428" y2="70" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="399" cy="53" r="9" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="399" y="57" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">2</text>

  <!-- 3: evento -->
  <line class="d-line" x1="290" y1="100" x2="290" y2="138" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="272" cy="119" r="9" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="272" y="123" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">3</text>
  <text class="d-text" x="302" y="123" font-size="11" fill="#52616d">diário, a partir de 45 dias</text>

  <!-- 4: alerta -->
  <line class="d-line" x1="370" y1="170" x2="428" y2="170" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <line class="d-line" x1="570" y1="170" x2="618" y2="170" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="399" cy="153" r="9" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="399" y="157" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">4</text>

  <!-- 5: reimporta -->
  <polyline class="d-line-muted" points="685,140 685,20 290,20 290,38" fill="none" stroke="#52616d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#seta)"/>
  <circle class="d-step" cx="600" cy="20" r="9" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="600" y="24" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">5</text>
  <text class="d-text" x="675" y="60" text-anchor="end" font-size="11" fill="#52616d">reimporta</text>
  <text class="d-text" x="675" y="75" text-anchor="end" font-size="11" fill="#52616d">no mesmo ARN</text>
</svg>

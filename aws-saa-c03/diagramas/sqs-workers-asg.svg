<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="IBM Plex Sans, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-head" d="M0 0 L10 5 L0 10 z" fill="#1b2d3b"/>
    </marker>
  </defs>

  <rect class="d-box" x="10" y="40" width="130" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="75" y="67" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2d3b">Sistema</text>
  <text class="d-text" x="75" y="85" text-anchor="middle" font-size="11" fill="#52616d">de pedidos</text>

  <rect class="d-box-accent" x="190" y="40" width="150" height="60" rx="6" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-title" x="265" y="67" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Fila SQS</text>
  <text class="d-text" x="265" y="85" text-anchor="middle" font-size="11" fill="#52616d">guarda até o delete</text>

  <rect class="d-box" x="190" y="165" width="150" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="265" y="192" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">CloudWatch</text>
  <text class="d-text" x="265" y="210" text-anchor="middle" font-size="11" fill="#52616d">backlog por instância</text>

  <!-- Auto Scaling group -->
  <rect class="d-zone" x="390" y="15" width="220" height="220" rx="6" fill="#f2f6f7" stroke="#cbd5db"/>
  <text class="d-label" x="404" y="33" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">Auto Scaling group</text>
  <rect class="d-box" x="410" y="45" width="180" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="500" y="72" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">EC2 worker</text>
  <text class="d-text" x="500" y="90" text-anchor="middle" font-size="11" fill="#52616d">processa e só então apaga</text>
  <rect class="d-box" x="410" y="150" width="180" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="d-title" x="500" y="177" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">EC2 que falhou</text>
  <text class="d-text" x="500" y="195" text-anchor="middle" font-size="11" fill="#52616d">não chegou a apagar</text>

  <rect class="d-box" x="650" y="40" width="100" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="700" y="67" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">RDS</text>
  <text class="d-text" x="700" y="85" text-anchor="middle" font-size="11" fill="#52616d">idempotente</text>

  <!-- 1: envia -->
  <line class="d-line" x1="140" y1="70" x2="188" y2="70" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="164" cy="53" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="164" y="57" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">1</text>

  <!-- 2: recebe -->
  <line class="d-line" x1="340" y1="60" x2="408" y2="60" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="374" cy="44" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="374" y="48" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">2</text>

  <!-- 3: grava -->
  <line class="d-line" x1="590" y1="70" x2="648" y2="70" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="619" cy="53" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="619" y="57" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">3</text>

  <!-- 4: mensagem volta -->
  <polyline class="d-line-muted" points="410,180 370,180 370,90 342,90" fill="none" stroke="#52616d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#seta)"/>
  <circle class="d-step" cx="370" cy="135" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="370" y="139" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">4</text>
  <text class="d-text" x="500" y="228" text-anchor="middle" font-size="11" fill="#52616d">a mensagem volta após o visibility timeout</text>

  <!-- 5: escala pelo backlog -->
  <line class="d-line" x1="265" y1="100" x2="265" y2="163" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <text class="d-text" x="253" y="136" text-anchor="end" font-size="11" fill="#52616d">mensagens visíveis</text>
  <line class="d-line" x1="340" y1="215" x2="388" y2="215" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="364" cy="199" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="364" y="203" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">5</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="IBM Plex Sans, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-head" d="M0 0 L10 5 L0 10 z" fill="#1b2d3b"/>
    </marker>
  </defs>

  <!-- Contas e Regiões -->
  <rect class="d-zone" x="10" y="20" width="220" height="245" rx="6" fill="#f2f6f7" stroke="#cbd5db"/>
  <text class="d-label" x="24" y="40" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">contas da organização</text>
  <rect class="d-box" x="30" y="55" width="180" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="120" y="81" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Buckets S3</text>
  <text class="d-text" x="120" y="100" text-anchor="middle" font-size="12" fill="#52616d">conta A · us-east-1</text>
  <rect class="d-box" x="30" y="175" width="180" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="120" y="201" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Buckets S3</text>
  <text class="d-text" x="120" y="220" text-anchor="middle" font-size="12" fill="#52616d">conta B · eu-west-1</text>

  <!-- Organizations e Storage Lens -->
  <rect class="d-box" x="300" y="15" width="170" height="55" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="385" y="39" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">AWS Organizations</text>
  <text class="d-text" x="385" y="57" text-anchor="middle" font-size="11" fill="#52616d">trusted access + delegado</text>

  <rect class="d-box-accent" x="300" y="110" width="170" height="80" rx="6" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-title" x="385" y="141" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">S3 Storage Lens</text>
  <text class="d-text" x="385" y="160" text-anchor="middle" font-size="11" fill="#52616d">dashboard da organização</text>
  <text class="d-text" x="385" y="176" text-anchor="middle" font-size="11" fill="#52616d">na home Region</text>

  <!-- 1: trusted access -->
  <line class="d-line" x1="385" y1="70" x2="385" y2="108" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="363" cy="89" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="363" y="93" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">1</text>

  <!-- 2: métricas de todas as contas e Regiões -->
  <polyline class="d-line" points="210,85 255,85 255,205 210,205" fill="none" stroke="#1b2d3b" stroke-width="1.5"/>
  <line class="d-line" x1="255" y1="150" x2="298" y2="150" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="277" cy="132" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="277" y="136" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">2</text>

  <!-- 3: saídas -->
  <rect class="d-box" x="560" y="40" width="190" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="655" y="66" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Dashboard</text>
  <text class="d-text" x="655" y="85" text-anchor="middle" font-size="11" fill="#52616d">por conta, Região e bucket</text>
  <rect class="d-box" x="560" y="130" width="190" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="655" y="156" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Exportação diária</text>
  <text class="d-text" x="655" y="175" text-anchor="middle" font-size="11" fill="#52616d">CSV ou Parquet no S3</text>
  <polyline class="d-line" points="470,150 515,150 515,70 558,70" fill="none" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <line class="d-line" x1="515" y1="160" x2="558" y2="160" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <line class="d-line" x1="515" y1="150" x2="515" y2="160" stroke="#1b2d3b" stroke-width="1.5"/>
  <circle class="d-step" cx="493" cy="132" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="493" y="136" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">3</text>

  <!-- 4: ação corretiva -->
  <rect class="d-zone" x="300" y="215" width="450" height="50" rx="6" fill="#f2f6f7" stroke="#cbd5db"/>
  <circle class="d-step" cx="324" cy="240" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="324" y="244" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">4</text>
  <text class="d-text" x="342" y="235" font-size="12" fill="#52616d">Ação: regra de lifecycle AbortIncompleteMultipartUpload</text>
  <text class="d-text" x="342" y="252" font-size="12" fill="#52616d">nos buckets apontados (ex.: depois de 7 dias).</text>
</svg>

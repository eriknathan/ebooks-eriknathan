<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 245" font-family="IBM Plex Sans, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-head" d="M0 0 L10 5 L0 10 z" fill="#1b2d3b"/>
    </marker>
  </defs>

  <rect class="d-box" x="10" y="40" width="130" height="65" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="75" y="67" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Vestíveis</text>
  <text class="d-text" x="75" y="85" text-anchor="middle" font-size="11" fill="#52616d">leituras de saúde</text>

  <rect class="d-box" x="180" y="40" width="130" height="65" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="245" y="67" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Ingestão</text>
  <text class="d-text" x="245" y="85" text-anchor="middle" font-size="11" fill="#52616d">taxa diária conhecida</text>

  <rect class="d-box-accent" x="350" y="25" width="190" height="95" rx="6" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-title" x="445" y="50" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Tabela DynamoDB</text>
  <text class="d-label" x="445" y="70" text-anchor="middle" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">PROVISIONED</text>
  <text class="d-text" x="445" y="86" text-anchor="middle" font-size="11" fill="#52616d">WCU pela taxa + auto scaling</text>
  <text class="d-label" x="445" y="106" text-anchor="middle" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">STANDARD_INFREQUENT_ACCESS</text>

  <rect class="d-box" x="590" y="40" width="160" height="65" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="670" y="67" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2d3b">Relatório mensal</text>
  <text class="d-text" x="670" y="85" text-anchor="middle" font-size="11" fill="#52616d">leitura ocasional</text>

  <!-- decisão da classe -->
  <rect class="d-zone" x="180" y="155" width="570" height="80" rx="6" fill="#f2f6f7" stroke="#cbd5db"/>
  <text class="d-title" x="465" y="180" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2d3b">Standard-IA: armazenamento −60%, leitura e escrita +25%</text>
  <text class="d-text" x="465" y="200" text-anchor="middle" font-size="11" fill="#52616d">compensa quando o armazenamento passa de ~50% do custo mensal da tabela</text>
  <text class="d-text" x="465" y="216" text-anchor="middle" font-size="11" fill="#52616d">sem reserved capacity · troca de classe até 2 vezes em 30 dias</text>

  <!-- 1: gravação contínua -->
  <line class="d-line" x1="140" y1="72" x2="178" y2="72" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="159" cy="55" r="9" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="159" y="59" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">1</text>

  <!-- 2: capacidade provisionada -->
  <line class="d-line" x1="310" y1="72" x2="348" y2="72" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="329" cy="55" r="9" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="329" y="59" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">2</text>

  <!-- 3: leitura ocasional -->
  <line class="d-line-muted" x1="540" y1="72" x2="588" y2="72" stroke="#52616d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#seta)"/>
  <circle class="d-step" cx="564" cy="55" r="9" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="564" y="59" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">3</text>

  <!-- 4: classe de tabela -->
  <line class="d-line" x1="445" y1="120" x2="445" y2="153" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="427" cy="137" r="9" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="427" y="141" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">4</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 235" font-family="IBM Plex Sans, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-head" d="M0 0 L10 5 L0 10 z" fill="#1b2d3b"/>
    </marker>
  </defs>

  <!-- Linha da partida -->
  <rect class="d-box" x="10" y="40" width="130" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="75" y="67" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Servidores</text>
  <text class="d-text" x="75" y="85" text-anchor="middle" font-size="11" fill="#52616d">de jogo</text>

  <rect class="d-box" x="180" y="40" width="140" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="250" y="67" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">DAX</text>
  <text class="d-text" x="250" y="85" text-anchor="middle" font-size="11" fill="#52616d">estado em µs</text>

  <rect class="d-box" x="360" y="40" width="160" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="440" y="67" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">DynamoDB</text>
  <text class="d-text" x="440" y="85" text-anchor="middle" font-size="11" fill="#52616d">PITR ativo · TTL</text>

  <rect class="d-zone" x="560" y="40" width="190" height="60" rx="6" fill="#f2f6f7" stroke="#cbd5db"/>
  <text class="d-text" x="572" y="64" font-size="11" fill="#52616d">O TTL apaga as sessões antigas</text>
  <text class="d-text" x="572" y="80" font-size="11" fill="#52616d">da tabela; o histórico fica no S3.</text>

  <!-- Linha da análise -->
  <rect class="d-box" x="180" y="160" width="140" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="250" y="184" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2d3b">EventBridge</text>
  <text class="d-text" x="250" y="202" text-anchor="middle" font-size="11" fill="#52616d">Scheduler · diário</text>

  <rect class="d-box-accent" x="360" y="160" width="160" height="60" rx="6" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-title" x="440" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Export para o S3</text>
  <text class="d-text" x="440" y="202" text-anchor="middle" font-size="11" fill="#52616d">completo ou incremental</text>

  <rect class="d-box" x="560" y="160" width="90" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="605" y="187" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">S3</text>
  <text class="d-text" x="605" y="204" text-anchor="middle" font-size="11" fill="#52616d">histórico</text>

  <rect class="d-box" x="675" y="160" width="75" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="712" y="187" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2d3b">Athena</text>
  <text class="d-text" x="712" y="204" text-anchor="middle" font-size="11" fill="#52616d">SQL</text>

  <!-- Setas -->
  <line class="d-line" x1="140" y1="70" x2="178" y2="70" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="159" cy="53" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="159" y="57" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">1</text>
  <line class="d-line" x1="320" y1="70" x2="358" y2="70" stroke="#1b2d3b" stroke-width="1.5" marker-start="url(#seta)" marker-end="url(#seta)"/>
  <circle class="d-step" cx="339" cy="53" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="339" y="57" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">2</text>

  <line class="d-line" x1="440" y1="100" x2="440" y2="158" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <text class="d-text" x="452" y="133" font-size="11" fill="#52616d">a partir do PITR, sem RCU</text>
  <line class="d-line" x1="320" y1="190" x2="358" y2="190" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="339" cy="173" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="339" y="177" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">3</text>
  <line class="d-line" x1="520" y1="190" x2="558" y2="190" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="539" cy="173" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="539" y="177" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">4</text>
  <line class="d-line" x1="650" y1="190" x2="673" y2="190" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="662" cy="148" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="662" y="152" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">5</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="IBM Plex Sans, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-head" d="M0 0 L10 5 L0 10 z" fill="#1b2d3b"/>
    </marker>
  </defs>

  <rect class="d-box-accent" x="250" y="15" width="260" height="62" rx="6" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-title" x="380" y="40" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Firewall Manager</text>
  <text class="d-text" x="380" y="58" text-anchor="middle" font-size="11" fill="#52616d">conta administradora · uma política por Região</text>

  <!-- us-east-1 -->
  <rect class="d-zone" x="10" y="110" width="360" height="130" rx="6" fill="#f2f6f7" stroke="#cbd5db"/>
  <text class="d-label" x="24" y="128" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">us-east-1</text>
  <rect class="d-box" x="30" y="145" width="140" height="70" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="100" y="174" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Web ACL</text>
  <text class="d-text" x="100" y="192" text-anchor="middle" font-size="11" fill="#52616d">SQLi e XSS</text>
  <rect class="d-box" x="210" y="145" width="140" height="70" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="280" y="174" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">API Gateway</text>
  <text class="d-text" x="280" y="192" text-anchor="middle" font-size="11" fill="#52616d">API pública</text>
  <line class="d-line" x1="170" y1="180" x2="208" y2="180" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="189" cy="163" r="9" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="189" y="167" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">2</text>

  <!-- ap-southeast-2 -->
  <rect class="d-zone" x="390" y="110" width="360" height="130" rx="6" fill="#f2f6f7" stroke="#cbd5db"/>
  <text class="d-label" x="404" y="128" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">ap-southeast-2</text>
  <rect class="d-box" x="410" y="145" width="140" height="70" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="480" y="174" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Web ACL</text>
  <text class="d-text" x="480" y="192" text-anchor="middle" font-size="11" fill="#52616d">mesmas regras</text>
  <rect class="d-box" x="590" y="145" width="140" height="70" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="660" y="174" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">API Gateway</text>
  <text class="d-text" x="660" y="192" text-anchor="middle" font-size="11" fill="#52616d">API pública</text>
  <line class="d-line" x1="550" y1="180" x2="588" y2="180" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>

  <!-- 1: políticas -->
  <polyline class="d-line" points="330,77 330,95 100,95 100,143" fill="none" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <polyline class="d-line" points="430,77 430,95 525,95 525,143" fill="none" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="380" cy="95" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="380" y="99" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">1</text>

  <!-- 3: conformidade -->
  <text class="d-text" x="546" y="40" font-size="11" fill="#52616d">associa às APIs novas e</text>
  <text class="d-text" x="546" y="56" font-size="11" fill="#52616d">aponta as fora da política</text>
  <circle class="d-step" cx="528" cy="47" r="9" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="528" y="51" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">3</text>
</svg>

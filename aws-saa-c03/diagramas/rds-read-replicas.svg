<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="IBM Plex Sans, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-head" d="M0 0 L10 5 L0 10 z" fill="#1b2d3b"/>
    </marker>
  </defs>

  <rect class="d-box" x="10" y="95" width="130" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="75" y="122" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Aplicação</text>
  <text class="d-text" x="75" y="140" text-anchor="middle" font-size="11" fill="#52616d">loja on-line</text>

  <rect class="d-box-accent" x="300" y="20" width="180" height="60" rx="6" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-title" x="390" y="47" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">RDS MySQL primário</text>
  <text class="d-text" x="390" y="65" text-anchor="middle" font-size="11" fill="#52616d">pedidos e estoque</text>

  <rect class="d-box" x="300" y="175" width="180" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="390" y="202" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Read replica 1</text>
  <text class="d-text" x="390" y="220" text-anchor="middle" font-size="11" fill="#52616d">busca de produtos</text>

  <rect class="d-box" x="565" y="175" width="185" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="657" y="202" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Read replica 2</text>
  <text class="d-text" x="657" y="220" text-anchor="middle" font-size="11" fill="#52616d">busca de produtos</text>

  <!-- 1: escritas -->
  <polyline class="d-line" points="140,110 250,110 250,50 298,50" fill="none" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="274" cy="34" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="274" y="38" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">1</text>
  <text class="d-text" x="160" y="102" font-size="11" fill="#52616d">escritas</text>

  <!-- 2: replicação assíncrona -->
  <line class="d-line-muted" x1="390" y1="80" x2="390" y2="173" stroke="#52616d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#seta)"/>
  <polyline class="d-line-muted" points="480,50 657,50 657,173" fill="none" stroke="#52616d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#seta)"/>
  <circle class="d-step" cx="408" cy="127" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="408" y="131" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">2</text>
  <text class="d-text" x="426" y="131" font-size="11" fill="#52616d">replicação assíncrona</text>

  <!-- 3: leituras -->
  <polyline class="d-line" points="140,140 250,140 250,205 298,205" fill="none" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <polyline class="d-line" points="250,205 250,250 657,250 657,237" fill="none" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="274" cy="189" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="274" y="193" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">3</text>
  <text class="d-text" x="160" y="160" font-size="11" fill="#52616d">leituras</text>
</svg>

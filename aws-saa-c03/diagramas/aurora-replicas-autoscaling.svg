<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="IBM Plex Sans, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-head" d="M0 0 L10 5 L0 10 z" fill="#1b2d3b"/>
    </marker>
  </defs>

  <!-- Antes -->
  <rect class="d-zone" x="10" y="15" width="220" height="230" rx="6" fill="#f2f6f7" stroke="#cbd5db"/>
  <text class="d-label" x="24" y="33" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">antes: RDS for MySQL</text>
  <rect class="d-box" x="30" y="45" width="180" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="120" y="72" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Instância primária</text>
  <text class="d-text" x="120" y="90" text-anchor="middle" font-size="11" fill="#52616d">grava o binlog</text>
  <rect class="d-box" x="30" y="165" width="180" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="d-title" x="120" y="192" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Read replica</text>
  <text class="d-text" x="120" y="210" text-anchor="middle" font-size="11" fill="#52616d">reaplica as mudanças</text>
  <line class="d-line-muted" x1="120" y1="105" x2="120" y2="163" stroke="#52616d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#seta)"/>
  <text class="d-text" x="130" y="132" font-size="11" fill="#52616d">binlog assíncrono:</text>
  <text class="d-text" x="130" y="147" font-size="11" fill="#52616d">lag cresce no pico</text>

  <!-- 1: migração -->
  <line class="d-line" x1="230" y1="130" x2="288" y2="130" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="259" cy="113" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="259" y="117" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">1</text>

  <!-- Depois -->
  <rect class="d-zone" x="290" y="15" width="460" height="230" rx="6" fill="#f2f6f7" stroke="#cbd5db"/>
  <text class="d-label" x="304" y="33" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">depois: cluster Aurora MySQL</text>
  <circle class="d-step" cx="556" cy="29" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="556" y="33" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">4</text>
  <text class="d-text" x="574" y="33" font-size="11" fill="#52616d">Auto Scaling ajusta as réplicas</text>

  <rect class="d-box" x="310" y="45" width="140" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="380" y="72" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Writer</text>
  <text class="d-text" x="380" y="90" text-anchor="middle" font-size="11" fill="#52616d">cluster endpoint</text>
  <rect class="d-box" x="500" y="45" width="110" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="555" y="72" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Réplica</text>
  <text class="d-text" x="555" y="90" text-anchor="middle" font-size="11" fill="#52616d">reader endpoint</text>
  <rect class="d-box" x="630" y="45" width="105" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="682" y="72" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Réplica</text>
  <text class="d-text" x="682" y="90" text-anchor="middle" font-size="11" fill="#52616d">reader endpoint</text>

  <rect class="d-box-accent" x="310" y="160" width="425" height="45" rx="6" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-title" x="522" y="182" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Volume de cluster compartilhado</text>
  <text class="d-text" x="522" y="198" text-anchor="middle" font-size="11" fill="#52616d">6 cópias em 3 AZs</text>

  <!-- 2: writer grava -->
  <line class="d-line" x1="380" y1="105" x2="380" y2="158" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="362" cy="132" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="362" y="136" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">2</text>

  <!-- 3: réplicas leem o mesmo volume -->
  <line class="d-line" x1="555" y1="160" x2="555" y2="107" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <line class="d-line" x1="682" y1="160" x2="682" y2="107" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="618" cy="132" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="618" y="136" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">3</text>
  <text class="d-text" x="522" y="228" text-anchor="middle" font-size="11" fill="#52616d">réplicas leem o mesmo volume: lag normalmente bem abaixo de 100 ms</text>
</svg>

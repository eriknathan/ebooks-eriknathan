<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 225" font-family="IBM Plex Sans, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-head" d="M0 0 L10 5 L0 10 z" fill="#1b2d3b"/>
    </marker>
  </defs>

  <!-- Produção -->
  <rect class="d-zone" x="10" y="15" width="360" height="200" rx="6" fill="#f2f6f7" stroke="#cbd5db"/>
  <text class="d-label" x="24" y="33" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">produção · 24 horas</text>
  <rect class="d-box" x="30" y="45" width="320" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="190" y="72" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Auto Scaling group On-Demand</text>
  <text class="d-text" x="190" y="90" text-anchor="middle" font-size="11" fill="#52616d">checkout · várias AZs · sem interrupção</text>
  <rect class="d-box" x="30" y="135" width="320" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="190" y="162" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Savings Plan ou RI</text>
  <text class="d-text" x="190" y="180" text-anchor="middle" font-size="11" fill="#52616d">desconto sobre o uso contínuo</text>
  <line class="d-line" x1="190" y1="135" x2="190" y2="107" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <text class="d-text" x="202" y="125" font-size="11" fill="#52616d">cobre a base</text>

  <!-- Dev e teste -->
  <rect class="d-zone" x="390" y="15" width="360" height="200" rx="6" fill="#f2f6f7" stroke="#cbd5db"/>
  <text class="d-label" x="404" y="33" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">dev e teste · cerca de 8 horas</text>
  <rect class="d-box-accent" x="410" y="45" width="320" height="60" rx="6" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-title" x="570" y="72" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Auto Scaling group Spot</text>
  <text class="d-text" x="570" y="90" text-anchor="middle" font-size="11" fill="#52616d">builds e testes · vários tipos de instância</text>
  <rect class="d-box" x="410" y="135" width="320" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="570" y="162" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Ações agendadas</text>
  <text class="d-text" x="570" y="180" text-anchor="middle" font-size="11" fill="#52616d">8h sobe · 19h volta a zero</text>
  <line class="d-line" x1="570" y1="135" x2="570" y2="107" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>

  <!-- Passos -->
  <circle class="d-step" cx="345" cy="29" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="345" y="33" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">1</text>
  <circle class="d-step" cx="172" cy="121" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="172" y="125" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">2</text>
  <circle class="d-step" cx="725" cy="29" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="725" y="33" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">3</text>
  <circle class="d-step" cx="552" cy="121" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="552" y="125" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">4</text>
</svg>

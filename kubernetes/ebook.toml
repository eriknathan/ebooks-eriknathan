[pagina]
titulo = "Kubernetes — Guia de estudo"
descricao = "Guia de estudo de Kubernetes: arquitetura, Pods, Deployments, armazenamento, Services, Ingress e Gateway API, autoescalonamento, políticas, RBAC e Helm, com tabelas de decisão e flashcards."

[capa]
categoria = "Guia de estudo"
atualizado = "setembro de 2026"
codigo = "KUBERNETES"
exame = "Arquitetura · Workloads · Operação"
titulo = "Do Pod à produção"
subtitulo = "Da arquitetura do cluster ao Helm: Pods, Deployments, volumes, Services, Ingress e Gateway API, autoescalonamento, agendamento, políticas, Network Policies e RBAC, com tabelas de decisão, pegadinhas e flashcards. Conferido com o Kubernetes 1.37."
rotulo_destaques = "Cinco blocos do guia"
destaques_com_peso = false

[[capa.destaques]]

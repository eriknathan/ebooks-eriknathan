<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 760 222" font-family="IBM Plex Sans, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-head" d="M0 0 L10 5 L0 10 z" fill="#1b2d3b"/>
    </marker>
  </defs>

  <!-- Componentes -->
  <rect class="d-box" x="10" y="60" width="170" height="90" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="95" y="100" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Aplicação</text>
  <text class="d-text" x="95" y="120" text-anchor="middle" font-size="12" fill="#52616d">EC2 + cliente DAX</text>

  <rect class="d-box-accent" x="295" y="60" width="170" height="90" rx="6" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-title" x="380" y="100" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Cluster DAX</text>
  <text class="d-text" x="380" y="120" text-anchor="middle" font-size="12" fill="#52616d">Cache em memória</text>

  <rect class="d-box" x="580" y="60" width="170" height="90" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="665" y="100" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">DynamoDB</text>
  <text class="d-text" x="665" y="120" text-anchor="middle" font-size="12" fill="#52616d">Tabela</text>

  <!-- 1 e 2: aplicação ↔ DAX -->
  <line class="d-line" x1="180" y1="88" x2="293" y2="88" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="215" cy="66" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="215" y="70" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">1</text>
  <text class="d-text" x="231" y="70" font-size="12" fill="#52616d">Requisição</text>

  <line class="d-line" x1="295" y1="122" x2="182" y2="122" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="215" cy="144" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="215" y="148" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">2</text>
  <text class="d-text" x="231" y="148" font-size="12" fill="#52616d">Hit em µs</text>

  <!-- 3: DAX ↔ DynamoDB no cache miss -->
  <line class="d-line" x1="465" y1="88" x2="578" y2="88" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="490" cy="66" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="490" y="70" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">3</text>
  <text class="d-text" x="506" y="70" font-size="12" fill="#52616d">Cache miss</text>

  <line class="d-line" x1="580" y1="122" x2="467" y2="122" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <text class="d-text" x="522" y="148" text-anchor="middle" font-size="12" fill="#52616d">Grava no cache</text>

  <!-- 4 e 5: escritas e leituras fortemente consistentes -->
  <rect class="d-zone" x="10" y="182" width="740" height="70" rx="6" fill="#f2f6f7" stroke="#cbd5db"/>
  <circle class="d-step" cx="36" cy="204" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="36" y="208" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">4</text>
  <text class="d-text" x="54" y="208" font-size="12" fill="#52616d">Escritas: o DAX grava na tabela e, depois da confirmação, atualiza o cache (write-through).</text>
  <circle class="d-step" cx="36" cy="232" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="36" y="236" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">5</text>
  <text class="d-text" x="54" y="236" font-size="12" fill="#52616d">Leituras fortemente consistentes e transacionais: o DAX repassa à tabela, sem usar o cache.</text>
</svg>

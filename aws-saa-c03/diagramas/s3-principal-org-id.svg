<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 245" font-family="IBM Plex Sans, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-head" d="M0 0 L10 5 L0 10 z" fill="#1b2d3b"/>
    </marker>
  </defs>

  <!-- Organização -->
  <rect class="d-zone" x="10" y="15" width="480" height="220" rx="6" fill="#f2f6f7" stroke="#cbd5db"/>
  <text class="d-label" x="24" y="33" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">organização o-a1b2c3d4e5</text>

  <rect class="d-box" x="30" y="45" width="180" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="120" y="72" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Conta de marketing</text>
  <text class="d-text" x="120" y="90" text-anchor="middle" font-size="11" fill="#52616d">role com s3:GetObject</text>
  <rect class="d-box" x="30" y="155" width="180" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="120" y="182" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Conta nova</text>
  <text class="d-text" x="120" y="200" text-anchor="middle" font-size="11" fill="#52616d">entra sem mudar a política</text>

  <rect class="d-box-accent" x="270" y="85" width="200" height="80" rx="6" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-title" x="370" y="112" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Bucket S3</text>
  <text class="d-text" x="370" y="130" text-anchor="middle" font-size="11" fill="#52616d">conta de serviços compartilhados</text>
  <text class="d-label" x="370" y="150" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">aws:PrincipalOrgID</text>

  <!-- 1 e 2: contas da organização -->
  <polyline class="d-line" points="210,75 240,75 240,112 268,112" fill="none" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <polyline class="d-line" points="210,185 240,185 240,140 268,140" fill="none" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="225" cy="59" r="9" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="225" y="63" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">1</text>
  <circle class="d-step" cx="225" cy="201" r="9" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="225" y="205" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">2</text>
  <text class="d-text" x="370" y="190" text-anchor="middle" font-size="11" fill="#52616d">quem chama também precisa</text>
  <text class="d-text" x="370" y="205" text-anchor="middle" font-size="11" fill="#52616d">de permissão no próprio IAM</text>

  <!-- 3: conta externa -->
  <rect class="d-box" x="560" y="95" width="190" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="d-title" x="655" y="122" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Conta externa</text>
  <text class="d-text" x="655" y="140" text-anchor="middle" font-size="11" fill="#52616d">fora da organização</text>
  <line class="d-line-muted" x1="560" y1="125" x2="472" y2="125" stroke="#52616d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#seta)"/>
  <circle class="d-step" cx="525" cy="108" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="525" y="112" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">3</text>
  <text class="d-label" x="655" y="180" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">AccessDenied</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="IBM Plex Sans, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-head" d="M0 0 L10 5 L0 10 z" fill="#1b2d3b"/>
    </marker>
  </defs>

  <rect class="d-box" x="10" y="40" width="130" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="75" y="67" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Aplicação</text>
  <text class="d-text" x="75" y="85" text-anchor="middle" font-size="11" fill="#52616d">grava os registros</text>

  <!-- Bucket -->
  <rect class="d-zone" x="190" y="15" width="280" height="220" rx="6" fill="#f2f6f7" stroke="#cbd5db"/>
  <text class="d-label" x="204" y="33" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">bucket S3</text>
  <rect class="d-box" x="210" y="45" width="240" height="50" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="330" y="67" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2d3b">Versionamento + Object Lock</text>
  <text class="d-text" x="330" y="84" text-anchor="middle" font-size="11" fill="#52616d">retenção padrão: Governance, 7 anos</text>
  <rect class="d-box-accent" x="210" y="140" width="240" height="60" rx="6" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-title" x="330" y="166" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Versão do objeto</text>
  <text class="d-text" x="330" y="184" text-anchor="middle" font-size="11" fill="#52616d">travada até a data de retenção</text>

  <!-- 1: gravação -->
  <line class="d-line" x1="140" y1="70" x2="208" y2="70" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="174" cy="53" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="174" y="57" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">1</text>

  <!-- 2: herda a retenção -->
  <line class="d-line" x1="330" y1="95" x2="330" y2="138" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="312" cy="117" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="312" y="121" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">2</text>
  <text class="d-text" x="342" y="121" font-size="11" fill="#52616d">toda versão nova herda</text>

  <!-- Atores -->
  <rect class="d-box" x="540" y="20" width="210" height="55" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="645" y="43" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Role de compliance</text>
  <text class="d-label" x="645" y="62" text-anchor="middle" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">s3:BypassGovernanceRetention</text>
  <text class="d-text" x="645" y="92" text-anchor="middle" font-size="11" fill="#52616d">apaga com o header de bypass</text>

  <rect class="d-box" x="540" y="115" width="210" height="55" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="645" y="138" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Usuário comum</text>
  <text class="d-text" x="645" y="156" text-anchor="middle" font-size="11" fill="#52616d">sem permissão de bypass</text>
  <text class="d-label" x="645" y="187" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">AccessDenied</text>

  <!-- 3: exclusão autorizada -->
  <polyline class="d-line" points="540,47 495,47 495,155 452,155" fill="none" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="478" cy="100" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="478" y="104" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">3</text>

  <!-- 4: tentativa negada -->
  <polyline class="d-line-muted" points="540,142 515,142 515,185 452,185" fill="none" stroke="#52616d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#seta)"/>
  <circle class="d-step" cx="528" cy="163" r="9" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="528" y="167" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">4</text>

  <rect class="d-zone" x="540" y="198" width="210" height="44" rx="6" fill="#f2f6f7" stroke="#cbd5db"/>
  <text class="d-text" x="552" y="216" font-size="11" fill="#52616d">DELETE sem versão só cria um</text>
  <text class="d-text" x="552" y="232" font-size="11" fill="#52616d">delete marker; a versão continua</text>
</svg>

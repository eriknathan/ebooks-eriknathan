<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" font-family="IBM Plex Sans, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-head" d="M0 0 L10 5 L0 10 z" fill="#1b2d3b"/>
    </marker>
  </defs>

  <rect class="d-box" x="10" y="40" width="130" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="75" y="67" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Remetente</text>
  <text class="d-text" x="75" y="85" text-anchor="middle" font-size="11" fill="#52616d">recebe os pedidos</text>

  <rect class="d-box" x="200" y="40" width="160" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="280" y="67" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Fila SQS</text>
  <text class="d-text" x="280" y="85" text-anchor="middle" font-size="11" fill="#52616d">retenção de até 14 dias</text>

  <rect class="d-box" x="440" y="40" width="160" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="520" y="67" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Consumidor</text>
  <text class="d-text" x="520" y="85" text-anchor="middle" font-size="11" fill="#52616d">serviço de inventário</text>

  <rect class="d-box-accent" x="200" y="160" width="160" height="60" rx="6" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-title" x="280" y="187" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Dead-letter queue</text>
  <text class="d-text" x="280" y="205" text-anchor="middle" font-size="11" fill="#52616d">retenção maior que a da fila</text>

  <rect class="d-box" x="440" y="160" width="160" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="520" y="187" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Alarme</text>
  <text class="d-text" x="520" y="205" text-anchor="middle" font-size="11" fill="#52616d">CloudWatch na DLQ</text>

  <!-- 1 -->
  <line class="d-line" x1="140" y1="70" x2="198" y2="70" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="169" cy="53" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="169" y="57" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">1</text>

  <!-- 2: recebe e apaga -->
  <line class="d-line" x1="360" y1="58" x2="438" y2="58" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <line class="d-line" x1="440" y1="84" x2="362" y2="84" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="399" cy="41" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="399" y="45" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">2</text>
  <text class="d-text" x="400" y="103" text-anchor="middle" font-size="11" fill="#52616d">delete</text>

  <!-- 3: vai para a DLQ -->
  <line class="d-line" x1="300" y1="100" x2="300" y2="158" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="318" cy="130" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="318" y="134" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">3</text>
  <text class="d-text" x="336" y="134" font-size="11" fill="#52616d">após maxReceiveCount</text>

  <!-- 4: alarme -->
  <line class="d-line" x1="360" y1="190" x2="438" y2="190" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="399" cy="173" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="399" y="177" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">4</text>

  <!-- 5: redrive -->
  <line class="d-line-muted" x1="240" y1="158" x2="240" y2="102" stroke="#52616d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#seta)"/>
  <circle class="d-step" cx="222" cy="130" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="222" y="134" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">5</text>
  <text class="d-text" x="204" y="134" text-anchor="end" font-size="11" fill="#52616d">redrive após a correção</text>

  <!-- Ajustes -->
  <rect class="d-zone" x="625" y="40" width="125" height="180" rx="6" fill="#f2f6f7" stroke="#cbd5db"/>
  <text class="d-label" x="637" y="60" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">ajustes</text>
  <text class="d-text" x="637" y="82" font-size="11" fill="#52616d">visibility timeout</text>
  <text class="d-text" x="637" y="97" font-size="11" fill="#52616d">maior que o tempo</text>
  <text class="d-text" x="637" y="112" font-size="11" fill="#52616d">de processamento</text>
  <text class="d-text" x="637" y="142" font-size="11" fill="#52616d">com Lambda, a DLQ</text>
  <text class="d-text" x="637" y="157" font-size="11" fill="#52616d">fica na fila, não</text>
  <text class="d-text" x="637" y="172" font-size="11" fill="#52616d">na função</text>
</svg>

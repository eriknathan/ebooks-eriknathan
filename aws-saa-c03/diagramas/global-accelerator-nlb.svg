<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 322" font-family="IBM Plex Sans, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-head" d="M0 0 L10 5 L0 10 z" fill="#1b2d3b"/>
    </marker>
  </defs>

  <!-- Usuários e Global Accelerator -->
  <rect class="d-box" x="10" y="130" width="120" height="70" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="70" y="161" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Usuários</text>
  <text class="d-text" x="70" y="180" text-anchor="middle" font-size="12" fill="#52616d">EUA e Europa</text>

  <rect class="d-box-accent" x="200" y="125" width="150" height="80" rx="6" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-title" x="275" y="158" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Global</text>
  <text class="d-title" x="275" y="176" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Accelerator</text>
  <text class="d-text" x="275" y="195" text-anchor="middle" font-size="11" fill="#52616d">IPs anycast estáticos</text>

  <!-- 1: usuários → accelerator -->
  <line class="d-line" x1="130" y1="165" x2="198" y2="165" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="165" cy="146" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="165" y="150" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">1</text>
  <text class="d-text" x="165" y="186" text-anchor="middle" font-size="11" fill="#52616d">IP anycast</text>

  <!-- 2: backbone da AWS até a Região mais próxima e saudável -->
  <line class="d-line" x1="350" y1="165" x2="445" y2="165" stroke="#1b2d3b" stroke-width="1.5"/>
  <polyline class="d-line" points="445,165 445,85 488,85" fill="none" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <polyline class="d-line" points="445,165 445,255 488,255" fill="none" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="395" cy="146" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="395" y="150" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">2</text>
  <text class="d-text" x="395" y="186" text-anchor="middle" font-size="11" fill="#52616d">Backbone AWS</text>

  <!-- Região us-west-2 -->
  <rect class="d-zone" x="470" y="20" width="280" height="120" rx="6" fill="#f2f6f7" stroke="#cbd5db"/>
  <text class="d-label" x="484" y="40" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">us-west-2</text>
  <rect class="d-box" x="490" y="55" width="100" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="540" y="90" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">NLB</text>
  <rect class="d-box" x="650" y="55" width="90" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="695" y="82" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">EC2</text>
  <text class="d-text" x="695" y="100" text-anchor="middle" font-size="11" fill="#52616d">DNS</text>
  <line class="d-line" x1="590" y1="85" x2="648" y2="85" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="620" cy="66" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="620" y="70" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">3</text>
  <text class="d-text" x="620" y="104" text-anchor="middle" font-size="11" fill="#52616d">TCP/UDP</text>

  <!-- Região eu-west-1 -->
  <rect class="d-zone" x="470" y="190" width="280" height="120" rx="6" fill="#f2f6f7" stroke="#cbd5db"/>
  <text class="d-label" x="484" y="210" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">eu-west-1</text>
  <rect class="d-box" x="490" y="225" width="100" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="540" y="260" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">NLB</text>
  <rect class="d-box" x="650" y="225" width="90" height="60" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="695" y="252" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">EC2</text>
  <text class="d-text" x="695" y="270" text-anchor="middle" font-size="11" fill="#52616d">DNS</text>
  <line class="d-line" x1="590" y1="255" x2="648" y2="255" stroke="#1b2d3b" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle class="d-step" cx="620" cy="236" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="620" y="240" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">3</text>
  <text class="d-text" x="620" y="274" text-anchor="middle" font-size="11" fill="#52616d">TCP/UDP</text>

  <!-- 4: failover -->
  <circle class="d-step" cx="26" cy="262" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="26" y="266" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">4</text>
  <text class="d-text" x="44" y="266" font-size="12" fill="#52616d">Se uma Região falha nos health checks, o tráfego</text>
  <text class="d-text" x="44" y="284" font-size="12" fill="#52616d">vai para a outra em segundos, sem trocar o IP.</text>
</svg>

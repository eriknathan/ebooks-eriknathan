<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="IBM Plex Sans, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-head" d="M0 0 L10 5 L0 10 z" fill="#1b2d3b"/>
    </marker>
  </defs>

  <!-- VPCs das contas -->
  <rect class="d-box" x="10" y="20" width="190" height="55" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="105" y="44" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">VPC de produção</text>
  <text class="d-text" x="105" y="62" text-anchor="middle" font-size="11" fill="#52616d">conta A · 10.1.0.0/16</text>
  <rect class="d-box" x="10" y="105" width="190" height="55" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="105" y="129" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">VPC de desenvolvimento</text>
  <text class="d-text" x="105" y="147" text-anchor="middle" font-size="11" fill="#52616d">conta B · 10.2.0.0/16</text>
  <rect class="d-box" x="10" y="190" width="190" height="55" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="105" y="214" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">VPC de serviços</text>
  <text class="d-text" x="105" y="232" text-anchor="middle" font-size="11" fill="#52616d">conta C · 10.3.0.0/16</text>

  <!-- Conta de rede -->
  <rect class="d-zone" x="270" y="75" width="230" height="125" rx="6" fill="#f2f6f7" stroke="#cbd5db"/>
  <text class="d-label" x="284" y="93" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">conta de rede</text>
  <circle class="d-step" cx="392" cy="89" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="392" y="93" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">1</text>
  <rect class="d-box-accent" x="290" y="107" width="190" height="50" rx="6" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-title" x="385" y="129" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">Transit Gateway</text>
  <text class="d-text" x="385" y="146" text-anchor="middle" font-size="11" fill="#52616d">route tables por domínio</text>
  <text class="d-label" x="385" y="184" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">compartilhado via AWS RAM</text>

  <!-- 2: attachments -->
  <polyline class="d-line" points="200,47 240,47 240,217 200,217" fill="none" stroke="#1b2d3b" stroke-width="1.5"/>
  <line class="d-line" x1="200" y1="132" x2="240" y2="132" stroke="#1b2d3b" stroke-width="1.5"/>
  <line class="d-line" x1="240" y1="132" x2="288" y2="132" stroke="#1b2d3b" stroke-width="1.5" marker-start="url(#seta)" marker-end="url(#seta)"/>
  <circle class="d-step" cx="259" cy="115" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="259" y="119" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">2</text>

  <!-- 3: rotas -->
  <circle class="d-step" cx="222" cy="90" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="222" y="94" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">3</text>

  <!-- 4: on-premises -->
  <rect class="d-box" x="560" y="105" width="190" height="55" rx="6" fill="#fff" stroke="#1b2d3b" stroke-width="1.5"/>
  <text class="d-title" x="655" y="129" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2d3b">On-premises</text>
  <text class="d-text" x="655" y="147" text-anchor="middle" font-size="11" fill="#52616d">VPN ou Direct Connect</text>
  <line class="d-line" x1="482" y1="132" x2="558" y2="132" stroke="#1b2d3b" stroke-width="1.5" marker-start="url(#seta)" marker-end="url(#seta)"/>
  <circle class="d-step" cx="520" cy="115" r="10" fill="#fff3de" stroke="#ff9900" stroke-width="1.5"/>
  <text class="d-num" x="520" y="119" text-anchor="middle" font-size="11" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#8a4b00">4</text>

  <!-- Nota de rotas -->
  <rect class="d-zone" x="270" y="215" width="480" height="35" rx="6" fill="#f2f6f7" stroke="#cbd5db"/>
  <text class="d-text" x="284" y="237" font-size="11" fill="#52616d">Cada VPC também precisa, na própria route table, de uma rota para o Transit Gateway.</text>
</svg>

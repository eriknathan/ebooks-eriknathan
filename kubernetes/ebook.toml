[sintese]
introducao = "Este guia percorre o Kubernetes da arquitetura do cluster à entrega de aplicações com Helm, reunindo formatos de consulta rápida e prática ativa."
itens = [
  "O Kubernetes é declarativo: o API server guarda o estado desejado no etcd, e controladores, scheduler e kubelet trabalham em laços para alcançá-lo. O runtime (containerd ou CRI-O) executa os contêineres pela CRI (capítulos 1 a 3).",
  "Aplicações rodam em Pods criados por controladores: Deployments para réplicas sem estado, StatefulSets para identidade e dados, DaemonSets para agentes de nó. Requests, limits e probes definem onde e como elas rodam (capítulos 4 a 7 e 10).",
  "Volumes com CSI e StorageClasses, Services com DNS, ConfigMaps e Secrets e a entrada de tráfego pela Gateway API (ou por um Ingress mantido) com cert-manager completam a aplicação (capítulos 8 a 12).",
  "HPA, regras de agendamento, políticas de admissão, Network Policies e RBAC sustentam a operação segura; o Helm empacota tudo em charts versionados (capítulos 13 a 18).",
  "As pegadinhas, a referência de comandos e o autoteste (capítulos 19 a 21) oferecem revisão rápida, com {flashcards} perguntas. Versões e comportamentos foram conferidos em setembro de 2026.",
]
